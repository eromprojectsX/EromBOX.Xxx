name: Build EROM BOX Offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'EROM-BOX-OFFLINE-SEM-SERVIDOR.zip'
      - '.github/workflows/build-erombox-offline.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract Android project from ZIP
        run: |
          test -f EROM-BOX-OFFLINE-SEM-SERVIDOR.zip
          unzip -q EROM-BOX-OFFLINE-SEM-SERVIDOR.zip -d extracted
          test -f extracted/EROM-BOX-OFFLINE/android/app/build.gradle
      - name: Build debug APK
        run: cd extracted/EROM-BOX-OFFLINE/android && gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EROM-BOX-OFFLINE-APK
          path: extracted/EROM-BOX-OFFLINE/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
