name: Build EROM BOX Offline APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'EROM-BOX-OFFLINE-SEM-SERVIDOR.zip'
      - '.github/workflows/build-erombox-offline.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract Android project from ZIP
        run: |
          test -f EROM-BOX-OFFLINE-SEM-SERVIDOR.zip
          unzip -q EROM-BOX-OFFLINE-SEM-SERVIDOR.zip -d extracted
          test -f extracted/EROM-BOX-OFFLINE/android/app/build.gradle
      - name: Add offline login screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/EROM-BOX-OFFLINE/android/app/src/main/assets/site/index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<body>'
          login = r'''<body class="erom-auth-locked">
          <style>
          body.erom-auth-locked > *:not(#eromLogin){display:none!important}
          #eromLogin{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}
          #eromLogin .panel{width:100%;max-width:380px;background:#111722;border:1px solid #2b3444;border-radius:22px;padding:28px;box-sizing:border-box;box-shadow:0 20px 70px #0008;animation:eromPanelIn .65s ease both}\n          #eromLoginSplash{position:fixed;inset:0;z-index:2147483648;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070910;animation:eromSplashOut .7s ease 2.5s forwards}\n          #eromLoginSplash svg{width:130px;height:130px;overflow:visible}\n          #eromLoginSplash .draw{fill:none;stroke:#d5dfed;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:eromLogoDraw 1.8s ease forwards}\n          #eromLoginSplash .word{font:800 24px system-ui,sans-serif;letter-spacing:5px;fill:#edf3ff;opacity:0;animation:eromWordIn .6s ease 1.3s forwards}\n          #eromLoginSplash .tag{font:12px system-ui,sans-serif;letter-spacing:3px;fill:#8998af;opacity:0;animation:eromWordIn .5s ease 1.7s forwards}\n          @keyframes eromLogoDraw{to{stroke-dashoffset:0}} @keyframes eromWordIn{to{opacity:1}} @keyframes eromSplashOut{to{opacity:0;visibility:hidden;pointer-events:none}} @keyframes eromPanelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
          #eromLogin .brand{font-size:26px;font-weight:850;letter-spacing:2px;color:#d0d7e3;margin-bottom:8px}
          #eromLogin p{color:#aab4c4;margin:0 0 22px}
          #eromLogin label{display:block;font-size:13px;color:#c5ccda;margin:14px 0 6px}
          #eromLogin input{display:block;width:100%;box-sizing:border-box;padding:13px 14px;border-radius:11px;border:1px solid #394456;background:#080d15;color:#fff;font-size:16px;outline:none}
          #eromLogin button{width:100%;margin-top:18px;border:0;border-radius:11px;padding:14px;background:#c3ccd9;color:#080a0f;font-weight:800;font-size:16px}
          #eromLogin .error{min-height:18px;color:#ff8585;font-size:13px;margin-top:12px}
          </style>
          <section id="eromLogin" aria-label="Login EROM BOX"><div id="eromLoginSplash" aria-hidden="true"><svg viewBox="0 0 100 100"><path class="draw" d="M50 8 L88 30 L88 70 L50 92 L12 70 L12 30 Z M32 28 L68 50 L32 72 Z M32 28 L32 72"/></svg><div class="word">EROM BOX</div><div class="tag">SUA BIBLIOTECA</div></div><div class="panel"><div class="brand">EROM BOX</div><p>Acesse sua biblioteca pessoal offline.</p><form id="eromLoginForm" autocomplete="on"><label for="eromLoginUser">Usuário</label><input id="eromLoginUser" name="username" autocomplete="username" autocapitalize="none" required placeholder="Digite seu usuário"><label for="eromLoginPass">Senha</label><input id="eromLoginPass" name="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha"><button type="submit">Entrar</button><div id="eromLoginError" class="error" role="alert"></div></form></div></section>
          <script>
          (function(){
            var body=document.body, key='erombox-offline-auth-session';
            function unlock(){body.classList.remove('erom-auth-locked');var box=document.getElementById('eromLogin');if(box)box.remove();}
            try{if(sessionStorage.getItem(key)==='ok'){unlock();return;}}catch(e){}
            document.getElementById('eromLoginForm').addEventListener('submit',function(e){
              e.preventDefault();
              var u=document.getElementById('eromLoginUser').value.trim().toLowerCase();
              var p=document.getElementById('eromLoginPass').value;
              if((u==='erom'||u==='erom@erom.com')&&p==='6592'){
                try{sessionStorage.setItem(key,'ok');}catch(e){}
                unlock();
              }else{document.getElementById('eromLoginError').textContent='Usuário, e-mail ou senha incorretos.';}
            });
          })();
          </script>'''
          if marker not in s:
              raise SystemExit("Não foi possível localizar o início do body no HTML.")
          s = s.replace(marker, login, 1)
          p.write_text(s, encoding="utf-8")
          print("Tela de login offline adicionada.")
          PY
      - name: Build debug APK
        run: cd extracted/EROM-BOX-OFFLINE/android && gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EROM-BOX-OFFLINE-LOGIN-APK
          path: extracted/EROM-BOX-OFFLINE/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
